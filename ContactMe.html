<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="mystyle.css" >
    <script src="language.js" defer></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=VT323&display=swap'); 
    </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ella's Portfolio</title>
</head>
<body>
    <header>
        
         <nav>            
            <div class = "nav-stuff"><a href="index.html" data-name="portfolioNAV" >Portfolio</a></div>
            <div class = "nav-stuff"><a href="index.html#projects" data-name="projectsNav">Projects</a></div>
            <div class = "nav-stuff"><a href="AboutMe.html"data-name="AboutMeNAV">About Me</a></div>
            <div class = "nav-stuff"><a href="ContactMe.html" data-name="ContactMeNAV">Contact Me</a></div>
            <div class  = "nav-stuff" ><button id = "language-button"><img id = "englishButtonPNG"src = "images/eng.png"></button></div>
            
         </nav>
    </header>
    <main>
    <h1 class = "lilac-text text-center" data-description="contactH1">Contact me</h1>
    
    <div class = "contact-boxes lilac-text">
        <div class = "contact-boxes-seperated">
            <svg class="contact-email-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8"></path><path d="M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            <p style = "font-size: large;" class= "text-center"><b>Direct contact</b></p>
            <a href="mailto:ellavandenhoogenband@gmail.com" class="email-button text-center">ellavandenhoogenband@gmail.com</a>
        </div>
        <div class = "contact-boxes-seperated-1">
            <div class= "contact-links">Github <a href= "https://github.com/ellamvdh"> : ellamvdh</a></div>
            <div class= "contact-links">Linked In<a href= "https://nl.linkedin.com/in/ella-marije-van-den-hoogenband-2140841a6" > : Ella Marije</a></div>
            <div class= "contact-links">Itch Io<a href= "https://ellamvdh.itch.io/"> : ellamvdh</a></div>

        </div>
    </div>

    <footer class = "lilac-text text-center"  data-description="rechten">
        © 2026 Ella Marije van den Hoogenband. All rights reserved.
    </footer>
    <script>
        let language = localStorage.getItem("language") || "Dutch";
        
        let languageIMG= document.getElementById("englishButtonPNG");
        const languageButton = document.getElementById("language-button");
        let info; //the found json data

        let rechten = document.querySelector('[data-description="rechten"]');
        let portfolioNAV = document.querySelector('[data-name="portfolioNAV"]');
        let projectsNAV = document.querySelector('[data-name="projectsNav"]');
        let aboutMeNAV = document.querySelector('[data-name="AboutMeNAV"]');
        let contectMeNAV = document.querySelector('[data-name="ContactMeNAV"]');
        let contactH1 = document.querySelector('[data-description="contactH1"]')
         function loadDutch(){
            
            //general
            rechten.textContent = info["Dutch"]["General"]["rechtenVoorbehouden"];
            portfolioNAV.textContent = info["Dutch"]["General"]["nav"]["portfolio"];
            projectsNAV.textContent = info["Dutch"]["General"]["nav"]["projects"];
            aboutMeNAV.textContent = info["Dutch"]["General"]["nav"]["about me"];
            contectMeNAV.textContent = info["Dutch"]["General"]["nav"]["contact me"];
            contactH1.textContent = info["Dutch"]["General"]["nav"]["contact me"];
        }
        function loadEnglish(){

            //general
            rechten.textContent = info["English"]["General"]["rechtenVoorbehouden"];
            portfolioNAV.textContent = info["English"]["General"]["nav"]["portfolio"];
            projectsNAV.textContent = info["English"]["General"]["nav"]["projects"];
            aboutMeNAV.textContent = info["English"]["General"]["nav"]["about me"];
            contectMeNAV.textContent = info["English"]["General"]["nav"]["contact me"];
            contactH1.textContent = info["English"]["General"]["nav"]["contact me"];
            
        }
        //fetch json and set initial data
        fetch('./aboutMe.json')
        .then(res => res.json())
        .then(data=>{
            //about text
            info = data;
            if(language == "Dutch"){
                loadDutch();
                languageIMG.src = "images/eng.png"
            }else {
                loadEnglish();
                languageIMG.src = "images/nl.png"
            }
        })

        //if button is clicked chnage the language
        languageButton.onclick = function(){
        if(language == "Dutch"){
            language = "English";
            languageIMG.src = "images/nl.png"
            loadEnglish();
        }else if(language == "English"){
            language = "Dutch";
            languageIMG.src = "images/eng.png"
            loadDutch();
        }
        //save in local storgage for other pages too
         localStorage.setItem("language", language);
        
    }

    </script>
</body>
</html>
